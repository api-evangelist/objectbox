name: ObjectBox
description: >-
  ObjectBox is a high-performance, low-footprint, offline-first on-device database
  with built-in data synchronization and on-device vector search, designed for
  mobile, IoT, embedded, and edge computing applications. It is delivered as native
  language bindings (Java, Kotlin, C/C++, Go, Swift, Flutter/Dart, and Python)
  rather than a hosted REST API, giving apps ACID-compliant local persistence that
  works reliably offline and is described as up to 10x faster than SQLite. ObjectBox
  was the first on-device vector database on the market, targeting Edge AI use cases
  such as semantic search, recommendations, and retrieval-augmented generation, and
  offers optional bi-directional Data Sync between devices and the cloud, including a
  direct connector to MongoDB. Founded in Germany and backed by Techstars.
